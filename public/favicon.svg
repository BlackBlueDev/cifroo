<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B1A"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF6B00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background (Android Adaptive style) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#282828" stroke-width="6"/>

  <!-- Subtle chord grid pattern in background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2">
    <line x1="120" y1="140" x2="392" y2="140"/>
    <line x1="120" y1="200" x2="392" y2="200"/>
    <line x1="120" y1="260" x2="392" y2="260"/>
    <line x1="120" y1="320" x2="392" y2="320"/>
    <line x1="120" y1="380" x2="392" y2="380"/>
    <line x1="174" y1="140" x2="174" y2="380"/>
    <line x1="228" y1="140" x2="228" y2="380"/>
    <line x1="284" y1="140" x2="284" y2="380"/>
    <line x1="338" y1="140" x2="338" y2="380"/>
  </g>

  <!-- Icon Symbol: Stylized C / Plectrum guitar pick + Musical Chord Note -->
  <g filter="url(#glow)">
    <!-- Pick shape contour subtly tilted or central C badge -->
    <path d="M 256 96 C 344 96 400 156 392 248 C 384 340 290 416 256 428 C 222 416 128 340 120 248 C 112 156 168 96 256 96 Z" 
          fill="#1A1A1A" stroke="url(#orangeGrad)" stroke-width="14"/>

    <!-- Sharp Modern "C" merged with a musical note & sound beam -->
    <path d="M 320 200 C 300 176 276 168 250 168 C 204 168 172 204 172 256 C 172 308 204 344 250 344 C 280 344 306 330 324 304" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="26" stroke-linecap="round"/>
          
    <!-- Chord marker dot (orange fret dot) -->
    <circle cx="286" cy="256" r="16" fill="#FFFFFF"/>
    <circle cx="218" cy="232" r="12" fill="url(#orangeGrad)"/>
    <circle cx="254" cy="292" r="12" fill="url(#orangeGrad)"/>
  </g>

  <!-- Micro Stage Indicator badge -->
  <rect x="216" y="374" width="80" height="24" rx="12" fill="url(#orangeGrad)"/>
  <text x="256" y="391" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="12" fill="#0E0E0E" text-anchor="middle" letter-spacing="1.5">CIFROO</text>
</svg>
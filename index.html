    // Mapeamento Cromático com Suporte Completo a Bemóis e Sustenidos (Zero bug Bb -> C)
    const NOTE_TO_PITCH = {
      'B#': 0, 'C': 0,
      'C#': 1, 'Db': 1,
      'D': 2,
      'D#': 3, 'Eb': 3,
      'E': 4, 'Fb': 4,
      'E#': 5, 'F': 5,
      'F#': 6, 'Gb': 6,
      'G': 7,
      'G#': 8, 'Ab': 8,
      'A': 9,
      'A#': 10, 'Bb': 10,
      'B': 11, 'Cb': 11
    };

    const CHROMATIC_SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const CHROMATIC_FLATS  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

    function transposeNote(note, semitones) {
      if (!note || NOTE_TO_PITCH[note] === undefined) return note;
      const targetPitch = ((NOTE_TO_PITCH[note] + semitones) % 12 + 12) % 12;
      const useFlats = note.includes('b') || targetPitch === 10 || targetPitch === 3;
      const scale = useFlats ? CHROMATIC_FLATS : CHROMATIC_SHARPS;
      return scale[targetPitch];
    }

    function transposeSingleChord(chord, semitones) {
      if (!chord || semitones === 0) return chord;
      return chord.replace(/([A-G][#b]?)/g, (match) => transposeNote(match, semitones));
    }

    // Validador estrito de acordes (100% regex)
    function isChord(token) {
      if (!token) return false;
      const clean = token.replace(/^[\[\(]+|[\]\)]+$/g, '').trim();
      if (!clean) return false;
      return /^([A-G][#b]?(?:m|M|maj|min|dim|aug|sus|add|alt|º|°|ø|\+|\-)?[0-9\(\)\#\bMmajminsusaddalt]*(?:\/[A-G][#b]?)?)$/.test(clean);
    }

    // Renderizador seguro: linha só é de acordes se 100% dos tokens forem acordes
    function isChordLine(line) {
      if (!line || typeof line !== 'string') return false;
      const trimmed = line.trim();
      if (!trimmed || /^\[.+\]$/.test(trimmed)) return false;
      if (/^[eEbBgGdDaA][#b]?\s*\|/i.test(trimmed) || /\|-{2,}/.test(trimmed)) return false;

      const tokens = trimmed.split(/\s+/).filter(Boolean);
      if (tokens.length === 0) return false;
      const contentTokens = tokens.filter(t => !/^[\|\:\/\(\)\[\]\-\.]+$/.test(t));
      if (contentTokens.length === 0) return false;

      for (const token of contentTokens) {
        if (!isChord(token)) return false; // Palavra detectada -> trata como letra!
      }
      return true;
    }

    // Transpõe linha preservando espaçamento horizontal
    function transposeChordLine(line, semitones) {
      if (!line || semitones === 0) return line;
      return line.replace(/(^|[\s\|\(\)])([A-G][#b]?(?:m|M|maj|min|dim|aug|sus|add|alt|º|°|ø|\+|\-)?[0-9\(\)\#\bMmajminsusaddalt]*(?:\/[A-G][#b]?)?)(?=[\s\|\(\)]|$)/g,
        (match, prefix, chord) => {
          if (isChord(chord)) {
            return prefix + transposeSingleChord(chord, semitones);
          }
          return match;
        }
      );
    }

      // Cifra com transposição harmônica em tempo real (atualiza tela instantaneamente)

      return (

                  <div className="w-10 h-10 rounded-full bg-surface text-primary border border-primary font-black flex items-center justify-center mx-auto mb-4">
                    2
                  </div>

                <p className="mt-2 text-sm text-textSec">Tudo o que você precisa saber sobre o Cifroo.</p>
              </div>

              <div className="space-y-4">
                {[
                  {
                    q: 'O app realmente funciona sem nenhuma internet no palco?',
                    a: 'Sim, 100%! Ao colar o link do Cifra Club, todos os dados, acordes, letra e metadados são salvos no banco local do celular. Durante o culto ou show, o app não faz nenhuma conexão com a internet.'
                  },
                  {
                    q: 'Se eu baixar uma nova versão do app, vou perder minhas músicas salvas?',
                    a: 'Não! O Cifroo foi arquitetado para atualizações in-place do Android. Ao instalar um novo APK por cima do antigo, o Android preserva integralmente todas as suas cifras salvas, edições manuais, repertórios e preferências.'
                  },
                  {
                    q: 'Como funciona a transposição automática por Capotraste?',
                    a: 'Ao alterar a casa do capotraste, o motor harmônico do Cifroo calcula a forma escrita (shapeKey) mantendo o som real (soundingKey) idêntico ao que a banda e a congregação estão ouvindo.'
                  },
                  {
                    q: 'Posso usar para Teclado e Contrabaixo também?',
                    a: 'Sim! O Cifroo possui visualizador harmônico multi-instrumento. Ao clicar em qualquer acorde, você pode alternar entre violão (braço com casas e dedos), teclado e contrabaixo.'
                  },
                  {
                    q: 'O aplicativo tem anúncios ou mensalidade?',
                    a: 'Zero anúncios e zero cobranças. O Cifroo foi feito por músicos para músicos com o compromisso de jamais interromper uma ministração com propagandas.'
                  }
                ].map((faq, idx) => (
                  <div
                    key={idx}
                    className="rounded-xl bg-surface border border-border overflow-hidden"
                  >
                    <button
                      onClick={() => setOpenFaq(openFaq === idx ? null : idx)}
                      className="w-full p-4 text-left font-bold text-sm text-white flex items-center justify-between hover:text-primary transition-colors"
                    >
                      <span>{faq.q}</span>
                      {openFaq === idx ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
                    </button>
                    {openFaq === idx && (
                      <div className="px-4 pb-4 text-xs text-textSec leading-relaxed border-t border-border pt-3">
                        {faq.a}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>

                <span className="font-bold text-white">Cifroo Mobile</span>
                <span>• Feito para Músicos de Palco</span>

              <div className="flex items-center gap-6">
                <a href={GITHUB_RELEASE_APK_URL} target="_blank" rel="noopener noreferrer" className="hover:text-primary transition-colors">
                  Baixar APK (v0.0.1)
                </a>
                <a href="./version.json" className="hover:text-primary transition-colors">
                  Version Manifest
                </a>
              </div>

              <p>© {new Date().getFullYear()} Cifroo Mobile. Todos os direitos reservados.</p>

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
